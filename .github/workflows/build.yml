name: Build Axiom

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.0'

      - name: Build mod
        run: gradle --no-daemon build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v6
        with:
          name: axiom-build
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: axiom-build-reports
          path: |
            build/reports/**
            build/test-results/**
          if-no-files-found: ignore
