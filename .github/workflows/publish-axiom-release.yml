name: Publish Axiom Client Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build Axiom client foundation
        run: gradle --no-daemon build

      - name: Prepare Axiom client asset
        shell: pwsh
        run: Copy-Item build/libs/axiom-0.1.0.jar build/libs/axiom.jar

      - name: Build standalone Axiom launcher
        working-directory: launcher/AxiomLauncher
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ../../launcher-dist

      - name: Verify release assets
        shell: pwsh
        run: |
          if (-not (Test-Path build/libs/axiom.jar)) { throw 'axiom.jar was not produced.' }
          if (-not (Test-Path launcher-dist/AxiomLauncher.exe)) { throw 'AxiomLauncher.exe was not produced.' }
          if (-not (Test-Path client/axiom-client.json)) { throw 'client/axiom-client.json was not produced.' }
          if ((Get-Item build/libs/axiom.jar).Length -le 0) { throw 'axiom.jar is empty.' }
          if ((Get-Item launcher-dist/AxiomLauncher.exe).Length -le 0) { throw 'AxiomLauncher.exe is empty.' }
          $manifest = Get-Content client/axiom-client.json -Raw | ConvertFrom-Json
          foreach ($field in @('clientVersion', 'minecraftVersion', 'fabricLoaderVersion', 'fabricApiVersion', 'clientAsset', 'launcherAsset')) {
            if ([string]::IsNullOrWhiteSpace($manifest.$field)) { throw "Manifest $field is missing." }
          }
          if ($manifest.clientAsset -ne 'axiom.jar') { throw "Manifest clientAsset must be axiom.jar, got '$($manifest.clientAsset)'." }
          if ($manifest.launcherAsset -ne 'AxiomLauncher.exe') { throw "Manifest launcherAsset must be AxiomLauncher.exe, got '$($manifest.launcherAsset)'." }
          if ($manifest.clientAsset -match '[\\/]') { throw 'Manifest clientAsset contains a path separator.' }
          if ($manifest.launcherAsset -match '[\\/]') { throw 'Manifest launcherAsset contains a path separator.' }
          if ($manifest.clientAsset -in @('.', '..') -or $manifest.launcherAsset -in @('.', '..')) { throw 'Manifest asset name is invalid.' }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: axiom-build-${{ github.run_number }}
          name: Axiom Build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            build/libs/axiom.jar
            launcher-dist/AxiomLauncher.exe
            client/axiom-client.json
